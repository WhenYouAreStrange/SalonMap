<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>CSV просмотр</title>
    <style>
        /* Глобальный сброс и базовая типографика */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5rem 1rem;
            color: #1e293b;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 2rem 1.5rem 2.5rem;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ---- Drag & Drop зона ---- */
        #drop-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 360px;
            padding: 48px 32px;
            border: 2px dashed #c5d0de;
            border-radius: 7px;
            background: #f8fafc;
            color: #64748b;
            transition: border-color 0.2s, background 0.2s;
            z-index: 1;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }

        #drop-zone.has-file {
            width: 100%;
            max-width: 100%;
            padding: 24px 20px;
            border: 2px dashed #c5d0de;
            background: #f8fafc;
            gap: 4px;
        }

        #drop-zone.has-file .icon-svg {
            width: 48px;
            height: 48px;
        }

        #drop-zone.has-file .main-text {
            font-size: 1rem;
        }

        #drop-zone.has-file .or-text {
            font-size: 0.85rem;
        }

        #drop-zone.has-file .browse-btn {
            font-size: 0.9rem;
            padding: 0.45rem 1.6rem;
        }

        #drop-zone.has-file .hint-small {
            display: none;
        }

        #drop-zone.dragover {
            border-color: #0b2b4d;
            background: #ecf3fa;
        }

        .icon-svg {
            width: 72px;
            height: 72px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            user-select: none;
        }

        .icon-svg svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        #drop-zone .main-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #1e293b;
        }

        #drop-zone .or-text {
            font-size: 0.95rem;
            color: #94a3b8;
            font-weight: 400;
        }

        #drop-zone .browse-btn {
            display: inline-block;
            background: #0b2b4d;
            color: white;
            font-weight: 500;
            font-size: 1rem;
            padding: 0.55rem 2rem;
            border-radius: 60px;
            border: none;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(11, 43, 77, 0.12);
            cursor: pointer;
            user-select: none;
            letter-spacing: 0.2px;
        }

        #drop-zone .browse-btn:hover {
            background: #1a3f62;
        }

        #drop-zone .browse-btn:active {
            transform: scale(0.96);
        }

        #drop-zone .hint-small {
            position: absolute;
            bottom: 0.6rem;
            right: 1rem;
            font-size: 0.7rem;
            color: #b9c7d8;
            pointer-events: none;
            user-select: none;
            opacity: 0.6;
        }

        .file-input-hidden {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }

        .file-info {
            font-size: 0.9rem;
            color: #475569;
            background: #f1f5f9;
            padding: 0.5rem 1.2rem;
            border-radius: 7px;
            display: inline-block;
            margin: 1rem auto 1.2rem;
            word-break: break-all;
            max-width: 100%;
            text-align: center;
            transition: all 0.2s;
        }

        .file-info span {
            font-weight: 500;
            color: #0b2b4d;
        }

        .file-info .file-size {
            font-weight: 400;
            color: #64748b;
            margin-left: 0.3rem;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 0.5rem;
            border-radius: 7px;
            border: 1px solid #e9edf2;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 300px;
        }

        th {
            background: #f8fafc;
            color: #1e293b;
            font-weight: 600;
            padding: 0.9rem 0.7rem;
            border-bottom: 2px solid #dce2ea;
            text-align: left;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 3;
        }

        td {
            padding: 0.7rem 0.7rem;
            border-bottom: 1px solid #eef2f6;
            word-break: break-word;
            max-width: 300px;
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #fafcff;
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: #94a3b8;
            font-size: 1rem;
            background: transparent;
            border-radius: 16px;
            width: 100%;
        }

        .empty-state p {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        /* Адаптив для маленьких экранов */
        @media (max-width: 600px) {
            .container {
                padding: 1.2rem 0.8rem 1.8rem;
                border-radius: 24px;
            }

            #drop-zone {
                width: 100%;
                max-width: 100%;
                padding: 32px 20px;
                min-height: 160px;
            }

            .icon-svg {
                width: 56px;
                height: 56px;
            }

            #drop-zone .main-text {
                font-size: 1rem;
            }

            #drop-zone .browse-btn {
                font-size: 0.9rem;
                padding: 0.45rem 1.5rem;
            }

            #drop-zone.has-file {
                padding: 18px 16px;
            }

            #drop-zone.has-file .icon-svg {
                width: 40px;
                height: 40px;
            }

            #drop-zone.has-file .main-text {
                font-size: 0.9rem;
            }

            th,
            td {
                padding: 0.5rem 0.4rem;
                font-size: 0.8rem;
            }

            .table-wrapper {
                border-radius: 7px;
            }

            .file-info {
                font-size: 0.8rem;
                padding: 0.3rem 0.9rem;
                margin: 0.6rem auto 1rem;
            }
        }

        /* Критический диапазон 401-500px - уменьшаем шрифт чтобы избежать переносов */
        @media (min-width: 401px) and (max-width: 500px) {
            th,
            td {
                font-size: 0.7rem;
                padding: 0.4rem 0.3rem;
            }
        }

        @media (max-width: 400px) {
            th,
            td {
                font-size: 0.7rem;
                padding: 0.4rem 0.3rem;
            }

            #drop-zone {
                padding: 24px 16px;
                min-height: 140px;
            }

            .icon-svg {
                width: 44px;
                height: 44px;
            }

            #drop-zone.has-file .icon-svg {
                width: 36px;
                height: 36px;
            }
        }

        /* На очень маленьких экранах разрешаем перенос */
        @media (max-width: 360px) {
            td {
                white-space: normal;
                word-break: break-all;
                max-width: 120px;
            }
            
            th {
                white-space: normal;
                word-break: break-word;
            }
        }

        .table-wrapper::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

        <div id="fileInfo" class="file-info">📎 Файл не выбран</div>

                <p>
                    <span>Загрузите CSV-файл, чтобы увидеть данные</span>
                    <span style="font-size:0.8rem; color:#b9c7d8;">Поддерживаются: запятая, точка с запятой,
                        табуляция</span>
                </p>
            </div>
            <div class="table-wrapper" id="tableWrapper" style="display: none;">
                <table id="csvTable">
                    <thead id="tableHead"></thead>

    <script>
        (function () {
            const fileInput = document.getElementById('csvFileInput');
            const dropZone = document.getElementById('drop-zone');
            const browseBtn = document.getElementById('browseBtn');
            const fileInfo = document.getElementById('fileInfo');
            const tableWrapper = document.getElementById('tableWrapper');
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');

            function parseCSV(text) {
                if (text.charCodeAt(0) === 0xFEFF) {
                    text = text.slice(1);
                }

                const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                if (lines.length === 0) return [];

                const firstLine = lines[0];
                const separators = [',', ';', '\t'];
                let bestSep = ',';
                let maxCount = -1;

                separators.forEach(sep => {
                    const count = (firstLine.match(new RegExp(sep, 'g')) || []).length;
                    if (count > maxCount) {
                        maxCount = count;
                        bestSep = sep;
                    }
                });

                if (maxCount === 0) {
                    if (firstLine.includes('\t')) bestSep = '\t';
                    else if (firstLine.includes(';')) bestSep = ';';
                    else bestSep = ',';
                }

                const result = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const row = [];
                    let current = '';
                    let insideQuotes = false;
                    let char, nextChar;

                    for (let j = 0; j < line.length; j++) {
                        char = line[j];
                        nextChar = (j + 1 < line.length) ? line[j + 1] : '';

                        if (char === '"') {
                            if (insideQuotes && nextChar === '"') {
                                current += '"';
                                j++;
                            } else {
                                insideQuotes = !insideQuotes;
                            }
                        } else if (char === bestSep && !insideQuotes) {
                            row.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    row.push(current.trim());

                    const hasData = row.some(cell => cell !== '');
                    if (hasData || row.length > 1) {
                        result.push(row);
                    }
                }
                return result;
            }

            function renderTable(data) {
                if (!data || data.length === 0) {
                    emptyState.style.display = 'block';
                    tableWrapper.style.display = 'none';
                    return;
                }

                let headerRow = [];
                let bodyRows = [];

                if (data.length >= 2) {
                    headerRow = data[0].map(h => h.trim() || '—');
                    bodyRows = data.slice(1);
                } else {
                    headerRow = data[0].map((_, idx) => `Столбец ${idx + 1}`);
                    bodyRows = [data[0]];
                }

                tableHead.innerHTML = '';
                tableBody.innerHTML = '';

                const theadRow = document.createElement('tr');
                headerRow.forEach(header => {
                    const th = document.createElement('th');
                    th.textContent = header;
                    theadRow.appendChild(th);
                });
                tableHead.appendChild(theadRow);

                bodyRows.forEach(row => {
                    const tr = document.createElement('tr');
                    const rowData = [...row];
                    while (rowData.length < headerRow.length) {
                        rowData.push('');
                    }
                    const cells = rowData.slice(0, headerRow.length);
                    cells.forEach(cell => {
                        const td = document.createElement('td');
                        td.textContent = cell || ' ';
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                });

                emptyState.style.display = 'none';
                tableWrapper.style.display = 'block';
            }

            function updateFileInfo(file) {
                if (!file) {
                    fileInfo.innerHTML = '📎 Файл не выбран';
                    return;
                }
                const sizeInKB = (file.size / 1024).toFixed(1);
                const sizeStr = file.size < 1024 ? `${file.size} байт` : `${sizeInKB} KB`;
                fileInfo.innerHTML = `📎 <span>${file.name}</span> <span class="file-size">· ${sizeStr}</span>`;
            }

            function setDropZoneState(hasFile) {
                if (hasFile) {
                    dropZone.classList.add('has-file');
                } else {
                    dropZone.classList.remove('has-file');
                }
            }

            function handleFile(file) {
                if (!file) {
                    updateFileInfo(null);
                    setDropZoneState(false);
                    emptyState.style.display = 'block';
                    tableWrapper.style.display = 'none';
                    return;
                }

                updateFileInfo(file);
                setDropZoneState(true);

                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const text = e.target.result;
                        const parsedData = parseCSV(text);
                        renderTable(parsedData);
                    } catch (err) {
                        fileInfo.innerHTML = `⚠️ Ошибка парсинга: ${err.message || 'неизвестная ошибка'}`;
                        emptyState.style.display = 'block';
                        tableWrapper.style.display = 'none';
                        console.warn('CSV parsing error:', err);
                    }
                };

                reader.onerror = function () {
                    fileInfo.innerHTML = '❌ Не удалось прочитать файл';
                    emptyState.style.display = 'block';
                    tableWrapper.style.display = 'none';
                };

                reader.readAsText(file, 'UTF-8');
            }

            fileInput.addEventListener('change', function (event) {
                const file = event.target.files[0];
                if (!file) {
                    updateFileInfo(null);
                    setDropZoneState(false);
                    emptyState.style.display = 'block';
                    tableWrapper.style.display = 'none';
                    return;
                }
                handleFile(file);
                fileInput.value = '';
            });

            browseBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                fileInput.click();
            });

            dropZone.addEventListener('click', function (e) {
                if (e.target === browseBtn || e.target.closest('.browse-btn')) return;
                fileInput.click();
            });

            dropZone.addEventListener('dragover', function (e) {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', function (e) {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', function (e) {
                e.preventDefault();
                dropZone.classList.remove('dragover');

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const file = files[0];
                    const validTypes = ['text/csv', 'application/csv', ''];
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (validTypes.includes(file.type) || ext === 'csv') {
                        handleFile(file);
                    } else {
                        fileInfo.innerHTML = '⚠️ Пожалуйста, загрузите файл в формате CSV';
                        setDropZoneState(false);
                        emptyState.style.display = 'block';
                        tableWrapper.style.display = 'none';
                    }
                }
            });

            document.addEventListener('dragover', function (e) {
                e.preventDefault();
            });
            document.addEventListener('drop', function (e) {
                e.preventDefault();
            });

            emptyState.style.display = 'block';
            tableWrapper.style.display = 'none';
            setDropZoneState(false);

            if (!window.FileReader) {
                fileInfo.innerHTML = '⚠️ Ваш браузер не поддерживает FileReader';
            }
        })();
    </script>
</body>

</html>
